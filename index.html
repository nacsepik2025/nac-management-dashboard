<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a30">
<meta name="description" content="New Apostolic Church East and West Sepik Management System">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-64.png">
<title>NAC Sepik | Church Management System</title>
<link rel="stylesheet" href="styles.css">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="icons/icon-192.png" alt="NAC logo">
    <div>NAC Sepik<small>Church Management System</small></div>
  </div>
  <div class="profile">
    <span style="font-size:19px">♧</span>
    <div class="avatar">PW</div>
    <div class="who">
      <b id="adminName">Philemon Wasimbai</b>
      <small style="display:block;color:#8290a2">Administrator</small>
    </div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="navtitle">MANAGEMENT</div>
    <nav id="navigation"></nav>
    <div class="navfoot">
      <button class="navbtn" data-page="settings"><span class="navicon">⚙</span>Settings</button>
      <button class="navbtn" onclick="downloadBackup()"><span class="navicon">⬇</span>Download Backup</button>
      <button class="navbtn" id="installBtn" style="display:none;background:#16a34a;color:#fff"><span class="navicon">📱</span>Install App</button>
      <button class="navbtn" onclick="showToast('You are using this device profile.')"><span class="navicon">⇥</span>Log out</button>
    </div>
    <div id="cloudStatus" style="font-size:11px;padding:10px;color:#94a3b8">⏳ Connecting to cloud...</div>
  </aside>
  <main id="main"></main>
</div>

<div class="modalback" id="modalback">
  <div class="modal">
    <div class="modalhead">
      <h2 id="modalTitle">Add record</h2>
      <button class="x" onclick="closeModal()">✕</button>
    </div>
    <form id="recordForm">
      <div class="formgrid" id="formFields"></div>
      <div class="actions" style="justify-content:flex-end;margin-top:18px">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" type="submit">Save record</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== PASTE YOUR FIREBASE CONFIG HERE =====
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
try{ firebase.initializeApp(firebaseConfig); window.db = firebase.firestore(); }catch(e){ console.log(e); }
// PWA Install
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').style.display='flex'; });
document.getElementById('installBtn')?.addEventListener('click', async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
<script src="app.js"></script>
</body>
</html>
