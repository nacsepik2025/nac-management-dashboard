<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a30"><meta name="description" content="New Apostolic Church East and West Sepik Management System">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-64.png">
<title>NAC Sepik | Church Management System</title>
<style>
:root{--navy:#101a30;--blue:#1769aa;--bg:#f1f4f9;--text:#182338;--muted:#748094;--line:#e5eaf1;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}.brand img{width:42px;height:42px;border-radius:8px;object-fit:cover}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.profile{display:flex;align-items:center;gap:10px}.avatar{background:var(--navy);color:white;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 76px)}aside{width:280px;background:#fff;border-right:1px solid var(--line);padding:20px 12px;flex-shrink:0;overflow:auto}
.navtitle{font-size:11px;letter-spacing:1.2px;color:#a1aaba;font-weight:700;padding:8px 12px 14px}
.navbtn{width:100%;display:flex;align-items:center;gap:13px;border:0;background:transparent;color:#526071;text-align:left;padding:12px;border-radius:13px;margin:2px 0;font-weight:600}
.navbtn:hover{background:#f2f6fb}.navbtn.active{background:var(--navy);color:#fff;box-shadow:0 4px 12px #101a3022}.navicon{width:22px;text-align:center;font-size:18px}
.navfoot{border-top:1px solid var(--line);margin-top:22px;padding-top:14px}
main{flex:1;min-width:0;padding:28px 30px;max-width:1800px;margin:0 auto;width:100%}
.notice{background:#fff;border:1px solid var(--line);padding:13px 17px;border-radius:13px;margin-bottom:20px;color:#5a6677;box-shadow:0 2px 5px #18233808}
.hero{background:radial-gradient(circle at 94% 15%,#29344c 0 9%,transparent 9.2%),radial-gradient(circle at 88% 90%,#202d47 0 13%,transparent 13.2%),#101a30;color:white;border-radius:24px;min-height:160px;display:flex;align-items:center;gap:28px;padding:30px 5%;margin-bottom:24px;box-shadow:0 8px 18px #101a3018}
.hero img{width:98px;height:98px;object-fit:cover}.hero small{letter-spacing:3px;color:#bdc9dd;font-weight:700}.hero h1{font-size:29px;margin:6px 0}.hero p{margin:0;color:#cbd4e3;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 7px #17243a08;position:relative;overflow:hidden;min-height:150px}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent,#28b7d6)}.cardtop{display:flex;justify-content:space-between;align-items:center}.bubble{width:44px;height:44px;border-radius:13px;background:var(--tint,#e5f7fc);display:grid;place-items:center;font-size:20px;color:var(--accent,#28b7d6)}
.count{font-size:30px;font-weight:750;margin:16px 0 2px}.card h3{font-size:14px;margin:0 0 2px}.card p{margin:0;color:var(--muted);font-size:12px}.card{cursor:pointer}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #17243a12}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.pagehead h1{font-size:25px;margin:0}.pagehead p{color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:10px;font-weight:650;color:#344154}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.dark{background:var(--navy);border-color:var(--navy);color:white}.btn.danger{color:#c43e4d}.btn:hover{filter:brightness(.97)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 7px #17243a06}.panel h2{font-size:17px;margin:0 0 16px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.search{max-width:360px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#526071}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ec;border-radius:9px;padding:10px 11px;background:#fff;color:#263348;min-height:40px}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{outline:2px solid #b9dcf7;border-color:#6aaee3}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:12px 11px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f7f9fc;color:#657287;font-size:11px;text-transform:uppercase;letter-spacing:.5px}td.actions-cell{white-space:nowrap}.empty{text-align:center;color:#8994a4;padding:35px}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f6f9fd;padding:14px 18px;border-radius:12px;min-width:145px}.stat strong{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
.modalback{position:fixed;inset:0;background:#101a3077;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{background:white;border-radius:18px;padding:22px;width:min(760px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0}.x{border:0;background:#eef2f7;border-radius:8px;padding:7px 11px}
.toast{position:fixed;bottom:20px;right:20px;background:#14213a;color:#fff;padding:12px 18px;border-radius:10px;z-index:40;display:none}
.settingsrow{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}aside{width:245px}main{padding:22px}}
@media(max-width:760px){.topbar{height:65px;padding:0 13px}.layout{display:block}aside{width:100%;padding:8px;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);gap:4px}.navtitle,.navfoot{display:none}.navbtn{width:auto;white-space:nowrap;padding:9px 12px;margin:0}.navicon{width:auto}main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px;min-height:135px}.hero{padding:22px;gap:15px;min-height:140px}.hero img{width:65px;height:65px}.hero h1{font-size:20px}.hero p{font-size:12px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}.profile .who{display:none}}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.card .count{font-size:25px}.brand{font-size:15px}.hero img{width:52px;height:52px}.hero small{font-size:9px}}
@media print{body{background:#fff}.topbar,aside,.no-print,.actions-cell,.toolbar .btn{display:none!important}.layout{display:block}main{padding:0;max-width:none}.panel,.card{box-shadow:none;border:1px solid #ddd}.tablewrap{overflow:visible}table{min-width:0}th,td{font-size:10px;padding:6px}.pagehead{margin-bottom:10px}.print-title{display:block!important}}
.print-title{display:none}
</style></head>
<body>
<header class="topbar"><div class="brand"><img src="icons/icon-192.png"><div>NAC Sepik<small>Church Management System</small></div></div><div class="profile"><span style="font-size:19px">♧</span><div class="avatar">PW</div><div class="who"><b id="adminName">Philemon Wasimbai</b><small style="display:block;color:#8290a2">Administrator</small></div></div></header>
<div class="layout"><aside><div class="navtitle">MANAGEMENT</div><nav id="navigation"></nav><div class="navfoot"><button class="navbtn" data-page="settings"><span class="navicon">⚙</span>Settings</button><button class="navbtn" onclick="showToast('You are using this device profile.')"><span class="navicon">⇥</span>Log out</button></div></aside>
<main id="main"></main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="x" onclick="closeModal()">✕</button></div><form id="recordForm"><div class="formgrid" id="formFields"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save record</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const menu=[
['dashboard','▦','Dashboard'],['members','♙','Members'],['households','♧','Households'],['congregations','♜','Congregations'],['districts','▤','Districts'],['ministers','♢','Ministerial Brothers'],['events','▦','Events & Services'],['attendance','◉','Attendance'],['offerings','▥','Offerings'],['pastoral','◫','Pastoral Records'],['news','▣','Monthly News'],['media','▧','Media Library'],['reports','▤','Reports'],['apostle','▤','Apostle Reports']
];
const schemas={
members:[['Member ID','text'],['First Name','text'],['Last Name','text'],['Gender','select','Male|Female'],['Date of Birth','date'],['Phone','tel'],['Email','email'],['Congregation','text'],['Sub-District','text'],['District','text'],['Province','select','East Sepik|West Sepik'],['Membership Status','select','Active|Inactive|Transferred|Deceased'],['Date Joined','date'],['Remarks','textarea']],
households:[['Household ID','text'],['Household Head','text'],['Village','text'],['Ward','text'],['LLG','text'],['District','text'],['Province','select','East Sepik|West Sepik'],['Phone','tel'],['Number of Members','number'],['Congregation','text'],['Remarks','textarea']],
congregations:[['Congregation Name','text'],['Congregation Code','text'],['Sub-District','text'],['District','text'],['Province','select','East Sepik|West Sepik'],['Village / Location','text'],['Service Day','select','Sunday|Wednesday|Saturday|Other'],['Contact Person','text'],['Phone','tel'],['Status','select','Active|Inactive'],['Remarks','textarea']],
districts:[['District Name','text'],['District Code','text'],['Province','select','East Sepik|West Sepik'],['District Rector','text'],['Contact Number','tel'],['Number of Congregations','number'],['Remarks','textarea']],
ministers:[['Minister ID','text'],['Full Name','text'],['Status / Ministry','select','Apostle|District Rector|Priest|Deacon'],['Congregation','text'],['Sub-District','text'],['District','text'],['Province','select','East Sepik|West Sepik'],['Date Ordained','date'],['Ordained By','text'],['Phone','tel'],['Remarks','textarea']],
events:[['Event / Service Name','text'],['Date','date'],['Type of Service','select','Divine Service|Holy Communion|Baptism|Sealing|Ordination|Wedding|Funeral|Youth Service|Sunday School|Other'],['Congregation','text'],['Sub-District','text'],['Minister Conducting','text'],['Venue','text'],['Start Time','time'],['Attendance','number'],['Offering (K)','number'],['Remarks','textarea']],
attendance:[['Date','date'],['Congregation','text'],['Sub-District','text'],['Type of Service','select','Divine Service|Holy Communion|Sunday School|Youth Service|Other'],['Men','number'],['Women','number'],['Children','number'],['Visitors','number'],['Total Attendance','number'],['Minister in Charge','text'],['Remarks','textarea']],
offerings:[['Date','date'],['Congregation','text'],['Sub-District','text'],['Offering Type','select','Sunday Offering|Thanksgiving|Special Offering|Other'],['Amount (K)','number'],['Bank Deposit (K)','number'],['Deposit Slip / Reference','text'],['Received By','text'],['Remarks','textarea']],
pastoral:[['Date','date'],['Record Type','select','Baptism|Sealing|Ordination|Wedding|Funeral|Pastoral Visit|Soul Care|Other'],['Member / Person Name','text'],['Congregation','text'],['Sub-District','text'],['Minister','text'],['Number of Persons','number'],['Details','textarea']],
news:[['Date','date'],['Headline','text'],['Category','select','Church News|Events|Youth|Education|Community|Other'],['Province','select','East Sepik|West Sepik|Both'],['Submitted By','text'],['News / Article','textarea']],
media:[['Title','text'],['Media Type','select','Photo|Video|Document|Audio|Other'],['Date','date'],['Congregation / Event','text'],['File','file'],['Description','textarea']],
reports:[['Report Title','text'],['Report Type','select','Monthly|Quarterly|Annual|Special'],['Reporting Month','month'],['Province','select','East Sepik|West Sepik|Both'],['Prepared By','text'],['Summary / Remarks','textarea']],
apostle:[['Date','date'],['Apostle Name','select','Aimol Wasimbai|Lucas Supok|Nicky Kundilisik|Other'],['Province','select','East Sepik|West Sepik'],['Sub-District','text'],['Congregation','text'],['Type of Service','select','Divine Service|Holy Communion|Baptism|Sealing|Ordination|Other'],['Attendance','number'],['Offering (K)','number'],['Members Sealed','number'],['Ministers Ordained','number'],['Bank Deposit Slip Image','file'],['Remarks','textarea']]
};
const colors=['#24b8d4','#8a63e8','#20b89a','#eea12b','#d64acb','#4169df','#20b89a','#e94b67','#667789','#2b9ac4','#7a64d8','#e58c3c','#299d91','#3e6ec9'];
let page='dashboard',editId=null,searchTerm='';
const data=JSON.parse(localStorage.getItem('nacSepikData')||'{}');
function records(k){return data[k]||[]}
function save(){try{localStorage.setItem('nacSepikData',JSON.stringify(data));return true}catch(e){if(e.name==='QuotaExceededError'||e.code===22){showToast('Browser storage is full. Delete old media or use smaller images.');}else{showToast('Could not save data.');}console.error(e);return false}}
function total(k){return records(k).length}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initNav(){document.getElementById('navigation').innerHTML=menu.map(([id,ic,n])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}"><span class="navicon">${ic}</span>${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;searchTerm='';render()}
function render(){initNav();const main=document.getElementById('main');if(page==='dashboard'){main.innerHTML=dashboard();return}if(page==='settings'){main.innerHTML=settings();return}main.innerHTML=modulePage(page);bindSearch()}
function dashboard(){let cards=menu.slice(1).map(([id,ic,n],i)=>`<div class="card" style="--accent:${colors[i%colors.length]};--tint:${colors[i%colors.length]}20" onclick="go('${id}')"><div class="cardtop"><div class="bubble">${ic}</div><span style="color:#c5ced8">↗</span></div><div class="count">${total(id)}</div><h3>${n}</h3><p>${n==='Members'?'Registered church members':n==='Congregations'?'Active congregation records':n+' records'}</p></div>`).join('');
return `<div class="notice">Welcome back. Your church management workspace is ready.</div><section class="hero"><img src="icons/icon-192.png"><div><small>EAST & WEST SEPIK REGION</small><h1>Welcome to New Apostolic Church Dashboard</h1><p>A central view of members, congregations, districts, ministries and church activities.</p></div></section><div class="grid">${cards}</div><section class="panel" style="margin-top:20px"><h2>Regional overview</h2><div class="stats"><div class="stat"><strong>${total('members')}</strong><span>Members</span></div><div class="stat"><strong>${total('congregations')}</strong><span>Congregations</span></div><div class="stat"><strong>${total('attendance')}</strong><span>Attendance entries</span></div><div class="stat"><strong>${sum('offerings','Amount (K)').toFixed(2)}</strong><span>Total offerings (K)</span></div><div class="stat"><strong>${sum('apostle','Attendance')}</strong><span>Apostle report attendance</span></div></div></section>`}
function sum(k,f){return records(k).reduce((a,r)=>a+(Number(r[f])||0),0)}
function modulePage(k){let item=menu.find(x=>x[0]===k),name=item?item[2]:k;let cols=(schemas[k]||[]).filter(x=>x[1]!=='textarea'&&x[1]!=='file').slice(0,5);let hasFile=(schemas[k]||[]).some(x=>x[1]==='file');let rows=records(k).filter(r=>Object.values(r).join(' ').toLowerCase().includes(searchTerm.toLowerCase()));let totals=k==='attendance'?`<div class="stat"><strong>${sum(k,'Total Attendance')}</strong><span>Total attendance</span></div>`:k==='offerings'?`<div class="stat"><strong>K ${sum(k,'Amount (K)').toFixed(2)}</strong><span>Total offerings</span></div>`:k==='apostle'?`<div class="stat"><strong>${sum(k,'Attendance')}</strong><span>Attendance</span></div><div class="stat"><strong>${sum(k,'Members Sealed')}</strong><span>Members sealed</span></div><div class="stat"><strong>${sum(k,'Ministers Ordained')}</strong><span>Ministers ordained</span></div><div class="stat"><strong>K ${sum(k,'Offering (K)').toFixed(2)}</strong><span>Offering total</span></div>`:k==='media'?`<div class="stat"><strong>${rows.filter(r=>r.File&&String(r.File).startsWith('data:')).length}</strong><span>With files</span></div>`:'';
return `<div class="pagehead"><div><h1>${name}</h1><p>Manage, search, update and print ${name.toLowerCase()} records.</p></div><div class="actions no-print"><button class="btn" onclick="exportCSV('${k}')">↓ Export CSV</button><button class="btn" onclick="sharePage('${k}')">↗ Share</button><button class="btn" onclick="window.print()">Print</button><button class="btn primary" onclick="openForm('${k}')">＋ Add ${name.replace(/s$/,'')}</button></div></div><h2 class="print-title">${name} — New Apostolic Church East & West Sepik</h2>${totals?`<div class="stats" style="margin-bottom:16px">${totals}<div class="stat"><strong>${rows.length}</strong><span>Records shown</span></div></div>`:''}<section class="panel"><div class="toolbar no-print"><input class="search" id="searchInput" placeholder="⌕ Search ${name.toLowerCase()}..." value="${esc(searchTerm)}"><span style="color:#7d8999">${rows.length} record(s)</span></div><div class="tablewrap"><table><thead><tr><th>#</th>${cols.map(f=>`<th>${esc(f[0])}</th>`).join('')}${hasFile?'<th>File</th>':''}<th class="no-print">Manage</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>{let fileCell='';if(hasFile){let fval=r.File||r['Bank Deposit Slip Image']||'';if(fval&&String(fval).startsWith('data:image')){fileCell=`<td><img src="${fval}" alt="file" style="width:48px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer" onclick="window.open(this.src)"></td>`}else if(fval&&String(fval).startsWith('data:')){fileCell=`<td><button class="btn" style="padding:4px 8px;font-size:12px" onclick="(function(d){let a=document.createElement('a');a.href=d;a.download='media-file';a.click()})(records('${k}').find(x=>x._id==='${r._id}')['File']||records('${k}').find(x=>x._id==='${r._id}')['Bank Deposit Slip Image'])">📎 Download</button></td>`}else{fileCell='<td style="color:#8994a4">—</td>'}}return `<tr><td>${i+1}</td>${cols.map(f=>`<td>${esc(r[f[0]]||'—')}</td>`).join('')}${fileCell}<td class="actions-cell no-print"><button class="btn" onclick="openForm('${k}','${r._id}')">Edit</button> <button class="btn danger" onclick="removeRecord('${k}','${r._id}')">Delete</button></td></tr>`}).join(''):`<tr><td colspan="${cols.length+(hasFile?1:0)+2}" class="empty">No records yet. Select “Add” to enter the first record.</td></tr>`}</tbody></table></div></section>`}
function storageUsed(){try{let s=JSON.stringify(data);let bytes=new Blob([s]).size;let kb=(bytes/1024).toFixed(1);let mb=(bytes/1024/1024).toFixed(2);return {bytes,kb,mb,label:bytes>1048576?mb+' MB':kb+' KB'}}catch(e){return {bytes:0,kb:'0',mb:'0',label:'0 KB'}}}
function settings(){return `<div class="pagehead"><div><h1>Settings</h1><p>Manage local app preferences and data.</p></div></div><section class="panel"><h2>System profile</h2><div class="field"><label>Administrator display name</label><input id="settingName" value="${esc(localStorage.getItem('nacAdminName')||'Philemon Wasimbai')}"></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveSettings()">Save settings</button></div></section><section class="panel"><h2>Data management</h2><div class="settingsrow"><div><b>Local storage used</b><div style="color:#7d8999">Images are resized to fit browser limits (~5 MB typical).</div></div><div style="font-weight:700;font-size:18px">${storageUsed().label}</div></div><div class="settingsrow"><div><b>Export complete backup</b><div style="color:#7d8999">Download all records stored on this device as JSON.</div></div><button class="btn" onclick="backup()">Download backup</button></div><div class="settingsrow"><div><b>Restore backup</b><div style="color:#7d8999">Import a previously exported NAC Sepik JSON backup.</div></div><input type="file" accept=".json,application/json" onchange="restore(event)" style="max-width:220px"></div><div class="settingsrow"><div><b>Clear all local records</b><div style="color:#7d8999">This permanently removes records saved in this browser.</div></div><button class="btn danger" onclick="clearAll()">Clear data</button></div></section><section class="panel"><h2>About this PWA</h2><p>NAC Sepik Church Management System · East & West Sepik Region. Records are stored locally in this browser. For shared multi-user access, connect the app to a secure online database such as Firebase.</p><button class="btn" onclick="installApp()">Install app</button></section>`}
function bindSearch(){let el=document.getElementById('searchInput');if(el)el.oninput=e=>{searchTerm=e.target.value;let pos=e.target.selectionStart;let v=e.target.value;document.getElementById('main').innerHTML=modulePage(page);let next=document.getElementById('searchInput');next.value=v;next.focus();next.setSelectionRange(pos,pos);bindSearch()}}
function openForm(k,id=null){editId=id;let rec=id?records(k).find(x=>x._id===id):{};document.getElementById('modalTitle').textContent=(id?'Edit ':'Add ')+menu.find(x=>x[0]===k)[2];document.getElementById('formFields').innerHTML=schemas[k].map((f)=>{let [label,type,opts]=f,val=rec?.[label]||'';let html='';if(type==='select'){html=`<select name="${esc(label)}"><option value="">Select...</option>${opts.split('|').map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else if(type==='textarea'){html=`<textarea name="${esc(label)}">${esc(val)}</textarea>`}else if(type==='file'){let preview='';if(val&&String(val).startsWith('data:')){if(String(val).startsWith('data:image')){preview=`<div style="margin:8px 0"><img src="${val}" alt="Current" style="max-width:180px;max-height:120px;border-radius:8px;border:1px solid var(--line)"><div style="font-size:12px;color:var(--muted);margin-top:4px">Current file attached — choose a new file to replace</div></div>`}else{preview=`<div style="margin:8px 0;padding:10px;background:#f6f9fd;border-radius:8px;font-size:13px">📎 File attached (re-select to replace)</div>`}}html=`${preview}<input name="${esc(label)}" type="file" accept="image/*,.pdf,.doc,.docx,audio/*,video/*"><div style="font-size:11px;color:var(--muted);margin-top:4px">Images are auto-resized for storage (up to ~1600px). Large files may still hit browser limits.</div>`}else{html=`<input name="${esc(label)}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(val)}">`}return `<div class="field ${type==='textarea'||type==='file'?'full':''}"><label>${esc(label)}</label>${html}</div>`}).join('');document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let obj={...(rec||{}),_id:id||('NAC-'+Date.now())};let fd=new FormData(e.target);let pending=[];for(let f of schemas[k]){let v=fd.get(f[0]);if(f[1]==='file'){let file=e.target.elements[f[0]].files[0];if(file){pending.push(readFileAsDataURL(file).then(dataUrl=>{obj[f[0]]=dataUrl}))} /* keep previous if no new file */}else obj[f[0]]=String(v||'').trim()}Promise.all(pending).then(()=>{try{data[k]=records(k).filter(x=>x._id!==obj._id);data[k].unshift(obj);if(save()){closeModal();render();showToast('Record saved successfully.')}else{/* save already showed toast; keep form open */}}catch(err){showToast('Save failed — storage full or file too large. Try a smaller image.');console.error(err)}}).catch(err=>{showToast('Could not process the selected file.');console.error(err)})};document.getElementById('modalback').classList.add('show')}
function readFileAsDataURL(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/')){let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(new Error('Failed to read file'));rd.readAsDataURL(file);return}let img=new Image();let url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);const MAX=1600;let w=img.width,h=img.height;if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX}else{w=Math.round(w*MAX/h);h=MAX}}let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);let quality=0.82;let dataUrl=canvas.toDataURL('image/jpeg',quality);// further reduce if still very large
if(dataUrl.length>900000){quality=0.65;dataUrl=canvas.toDataURL('image/jpeg',quality)}if(dataUrl.length>1200000){quality=0.5;dataUrl=canvas.toDataURL('image/jpeg',quality)}resolve(dataUrl)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Failed to load image'))};img.src=url})}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function removeRecord(k,id){if(confirm('Delete this record permanently?')){data[k]=records(k).filter(r=>r._id!==id);save();render();showToast('Record deleted.')}}
function exportCSV(k){let rs=records(k),fields=schemas[k].map(f=>f[0]);let csv=[fields,...rs.map(r=>fields.map(f=>r[f]||''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""').replace(/data:[^,]+,.*/,'[attached file]')+'"').join(',')).join('\r\n');download(csv,k+'-report.csv','text/csv')}
function download(content,name,type){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function sharePage(k){let text=menu.find(x=>x[0]===k)[2]+': '+records(k).length+' records. NAC East & West Sepik Management System.';if(navigator.share){try{await navigator.share({title:'NAC Sepik '+k,text})}catch(e){}}else{await navigator.clipboard?.writeText(text);showToast('Summary copied for sharing.')}}
function backup(){download(JSON.stringify(data,null,2),'nac-sepik-backup.json','application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(confirm('Replace current local records with this backup?')){Object.keys(data).forEach(k=>delete data[k]);Object.assign(data,obj);save();render();showToast('Backup restored.')}}catch(err){alert('Invalid backup file.')}};r.readAsText(f)}
function clearAll(){if(confirm('Are you sure? All records in this browser will be deleted.')){Object.keys(data).forEach(k=>delete data[k]);save();render();showToast('Local records cleared.')}}
function saveSettings(){let n=document.getElementById('settingName').value.trim()||'Administrator';localStorage.setItem('nacAdminName',n);document.getElementById('adminName').textContent=n;showToast('Settings saved.')}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else showToast('Use your browser menu and choose “Install app” or “Add to Home screen”.')}
if('serviceWorker'in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(localStorage.getItem('nacAdminName'))document.getElementById('adminName').textContent=localStorage.getItem('nacAdminName');
render();
</script></body></html>
